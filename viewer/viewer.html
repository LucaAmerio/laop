<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>laop monitor</title>
<link rel="icon" id="favicon" href="data:,">
<!-- laop monitor: served by viewer.py, next to this file. -->
<style>
:root {
  --bg: #f4f6f9; --panel: #ffffff; --panel2: #f8fafc; --ink: #18212f; --muted: #64748b; --line: #e2e8f0;
  --accent: #2563eb; --shadow: 0 1px 2px rgba(15,23,42,.06), 0 1px 8px rgba(15,23,42,.04);
  --done: #15803d;   --done-bg: #e8f6ee;
  --run: #2563eb;    --run-bg: #e7efff;
  --ready: #0f766e;  --ready-bg: #e3f5f3;
  --wait: #8391a7;   --wait-bg: #f1f4f8;
  --q: #b45309;      --q-bg: #fdf2e0;
  --oa: #7c3aed;     --oa-bg: #f1eafe;
  --bad: #c62828;    --bad-bg: #fdecec;
  --gate: #a16207;   --gate-bg: #fff6d8;
  --code-bg: #f1f5f9;
  --logo-blue: #3b6cff;
  /* motion: strong custom curves, UI transitions under 300ms */
  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  --ease-drawer: cubic-bezier(0.32, 0.72, 0, 1);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e131b; --panel: #151c27; --panel2: #1a2230; --ink: #e5eaf2; --muted: #94a3b8; --line: #263142;
    --accent: #60a5fa; --shadow: 0 1px 2px rgba(0,0,0,.4);
    --done: #4ade80;  --done-bg: #12301f;
    --run: #60a5fa;   --run-bg: #132743;
    --ready: #2dd4bf; --ready-bg: #0f2e2c;
    --wait: #7c8aa0;  --wait-bg: #1b2331;
    --q: #fbbf24;     --q-bg: #35280c;
    --oa: #c4b5fd;    --oa-bg: #2a1f47;
    --bad: #f87171;   --bad-bg: #3a1717;
    --gate: #facc15;  --gate-bg: #33290a;
    --code-bg: #0f1520;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e131b; --panel: #151c27; --panel2: #1a2230; --ink: #e5eaf2; --muted: #94a3b8; --line: #263142;
  --accent: #60a5fa; --shadow: 0 1px 2px rgba(0,0,0,.4);
  --done: #4ade80;  --done-bg: #12301f; --run: #60a5fa; --run-bg: #132743; --ready: #2dd4bf; --ready-bg: #0f2e2c;
  --wait: #7c8aa0;  --wait-bg: #1b2331; --q: #fbbf24; --q-bg: #35280c; --oa: #c4b5fd; --oa-bg: #2a1f47;
  --bad: #f87171;   --bad-bg: #3a1717; --gate: #facc15; --gate-bg: #33290a; --code-bg: #0f1520;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
code, pre, .mono { font-family: ui-monospace, "Cascadia Mono", Consolas, Menlo, monospace; font-size: 12.5px; }
button { font: inherit; color: inherit; background: var(--panel); border: 1px solid var(--line); border-radius: 7px; padding: 4px 10px; cursor: pointer;
  transition: transform 160ms var(--ease-out), border-color 150ms ease, background-color 150ms ease; }
/* press feedback on everything clickable */
button:active, .rtab:active, .chip:active { transform: scale(0.97); }
.rtab, .chip { transition: transform 160ms var(--ease-out), border-color 150ms ease; }
@media (hover: hover) and (pointer: fine) { button:hover { border-color: var(--accent); } }
button.active { background: var(--accent); border-color: var(--accent); color: #fff; }
a { color: var(--accent); cursor: pointer; text-decoration: none; }
a:hover { text-decoration: underline; }
h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 10px; font-weight: 600; }
.muted { color: var(--muted); }
.small { font-size: 12px; }
.wrap { padding: 0 16px 32px; }

header.top { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
header .bar { padding: 10px 16px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; }
header .brand { display: block; height: 26px; width: auto; color: var(--ink); flex: none; }
.rtabs { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; flex: 1; min-width: 0; }
.rtab { display: inline-flex; align-items: center; gap: 7px; padding: 5px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); cursor: pointer; font-weight: 600; font-size: 13px; max-width: 260px; }
@media (hover: hover) and (pointer: fine) {
  .rtab:hover, .ov-card:hover { border-color: var(--accent); }
  .chip:hover { border-color: var(--c); }
  table.tasks tr:hover td { background: var(--panel2); }
  .rtab .x:hover { color: var(--bad); background: var(--bad-bg); }
}
.rtab.active { border-color: var(--accent); box-shadow: inset 0 -3px 0 var(--accent); }
.rtab .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--wait); flex: none; }
.dot.running { background: var(--run); animation: blink 2s infinite; }
.dot.halted, .dot.kill { background: var(--bad); }
.dot.complete { background: var(--done); }
.dot.soft, .dot.paused { background: var(--q); }
.rtab .cnt { background: var(--gate); color: #fff; border-radius: 999px; font-size: 11px; padding: 0 6px; line-height: 17px; }
.rtab .cnt.bad { background: var(--bad); }
.rtab .x { color: var(--muted); border-radius: 4px; padding: 0 3px; line-height: 1; }
.rtab.add { font-weight: 800; color: var(--accent); }
.repohead { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; margin-top: 14px; }
/* the views and the stops have a row of their own: a long task title never moves them */
.repobar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; margin-top: 10px; }
.repohead .nowline { flex: 1 1 0; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.repohead h1 { font-size: 20px; margin: 0; }
.ov-top { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 16px; margin-top: 14px; }
.ov-top h1 { font-size: 20px; margin: 0; }
.ov-grid { display: grid; gap: 16px; margin-top: 14px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 460px), 1fr)); }
/* .card + .card adds a top margin: in a grid it pushes every card after the first down */
.ov-grid > .card, .ov-grid > .card + .card { margin: 0; }
.ov-card { cursor: pointer; transition: border-color 150ms ease; }
.ov-head { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; }
.ov-head h3 { margin: 0; font-size: 17px; }
.ov-card .bar-seg { margin-top: 10px; }
.ov-now { margin-top: 10px; font-size: 13.5px; overflow-wrap: anywhere; }
.ov-items { margin-top: 10px; display: flex; flex-direction: column; gap: 6px; }
.ov-item { border-left: 3px solid var(--c); background: var(--cb); padding: 5px 9px; border-radius: 6px; font-size: 13px; overflow-wrap: anywhere; }
.ov-item b { color: var(--c); }
.ov-foot { margin-top: 10px; font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
.addform { padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; }
.addform input { font: inherit; color: inherit; background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; width: 100%; }
.addform .err { color: var(--bad); font-weight: 600; min-height: 1em; }
.cands button { display: block; width: 100%; text-align: left; margin-top: 5px; overflow-wrap: anywhere; }
.pill { font-weight: 700; font-size: 12px; letter-spacing: .05em; padding: 4px 10px; border-radius: 999px; background: var(--wait-bg); color: var(--wait); white-space: nowrap; }
.pill.running { background: var(--run-bg); color: var(--run); }
.pill.complete { background: var(--done-bg); color: var(--done); }
.pill.halted, .pill.kill { background: var(--bad); color: #fff; }
.pill.soft, .pill.paused { background: var(--q-bg); color: var(--q); }
.live { width: 9px; height: 9px; border-radius: 50%; background: var(--wait); display: inline-block; }
.live.on { background: var(--done); animation: blink 2s infinite; }
.live.off { background: var(--bad); }
@keyframes blink { 50% { opacity: .35; } }
.spacer { flex: 1; }
.stops { display: flex; flex-wrap: wrap; gap: 6px; margin-left: auto; align-self: center; }
.stops button { font-size: 12.5px; padding: 3px 10px; }
.stops button.soft { color: var(--q); }
.stops button.hard { color: var(--bad); }
.stops button.soft.on { background: var(--q-bg); border-color: var(--q); }
.stops button.hard.on { background: var(--bad-bg); border-color: var(--bad); }
/* --alarm: a filled red that keeps white text readable in both themes (--bad is light in dark mode) */
:root { --alarm: #b71c1c; }
.stops button.emergency { color: #fff; background: var(--alarm); border-color: var(--alarm); font-weight: 600; }
.stops button.emergency.on { box-shadow: 0 0 0 2px var(--bad-bg); }
/* confirmation of a stop: hand-off stop in the panel colours, emergency stop in alarm red */
.modal .inner.confirm { width: min(560px, 100%); }
.confirm .cb { padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; font-size: 14px; line-height: 1.5; }
.confirm .cb ul { margin: 0; padding-left: 20px; }
.confirm .cf { padding: 12px 18px 16px; display: flex; justify-content: flex-end; gap: 8px; }
.confirm .cf .go { color: var(--bad); background: var(--bad-bg); border-color: var(--bad); font-weight: 600; }
.inner.confirm.emergency .cf .go { color: #fff; background: var(--alarm); border-color: var(--alarm); }
.inner.confirm.emergency { border: 3px solid var(--alarm); }
.inner.confirm.emergency .mh { background: var(--alarm); color: #fff; border-bottom-color: var(--alarm); }
.inner.confirm.emergency .mh b { font-size: 16px; letter-spacing: .04em; text-transform: uppercase; }
.inner.confirm.emergency .warn { background: var(--bad-bg); color: var(--bad); border: 1px solid var(--bad); border-radius: 8px; padding: 10px 12px; font-weight: 600; }
.stops button:disabled { opacity: .55; cursor: default; transform: none; }
/* a scheduled stop: the button says which and when */
.stops button.sched.on { color: var(--q); border-color: var(--q); border-style: dashed; }
.stops button.sched.on.emergency-at { color: var(--bad); border-color: var(--bad); }
.sopts { display: flex; flex-direction: column; gap: 6px; }
.sopt { display: flex; gap: 10px; align-items: flex-start; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; cursor: pointer; }
.sopt:has(input:checked) { border-color: var(--q); background: var(--q-bg); }
.sopt input { margin-top: 3px; }
.swhen { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; }
.swhen input { font: inherit; color: inherit; background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; }
.swhen button { font-size: 12.5px; padding: 3px 10px; }
.confirm .err { color: var(--bad); font-weight: 600; }
.confirm .err:empty { display: none; }
#banner { display: none; margin: 10px 0 0; padding: 0 16px; }
#banner div { padding: 8px 12px; border-radius: 8px; background: var(--q-bg); color: var(--q); font-weight: 600; }

.progress { margin: 14px 0 6px; }
.bar-seg { display: flex; height: 12px; border-radius: 6px; overflow: hidden; background: var(--line); }
.bar-seg span { display: block; height: 100%; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 8px; font-size: 12.5px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
.stats { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 12.5px; color: var(--muted); margin-top: 6px; }
.stats b { color: var(--ink); font-weight: 600; }

[hidden] { display: none !important; }
/* project views: Chat, Status (now, needs you, events), Questions (a discussion), Graph, Logs (tasks, log...) */
.ptabs { display: inline-flex; gap: 2px; padding: 3px; border-radius: 9px; background: var(--line); }
.ptabs button { border: 0; background: transparent; color: var(--muted); font-weight: 600; padding: 5px 14px; border-radius: 7px; display: inline-flex; align-items: center; gap: 7px; }
.ptabs button.on { background: var(--panel); color: var(--ink); box-shadow: 0 1px 2px rgba(15,23,42,.14); }
.cnt { background: var(--gate); color: #fff; border-radius: 999px; font-size: 11px; padding: 0 6px; line-height: 17px; }
.nowline { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
.nowline b { color: var(--ink); }
.pane { margin-top: 14px; }
.status-grid, .discuss-grid { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 900px) {
  .status-grid { grid-template-columns: minmax(0, .9fr) minmax(0, 1.6fr) minmax(0, .9fr); }
  /* --chatw: the width of the discussion, set by dragging the line at its left */
  .discuss-grid { grid-template-columns: 220px minmax(0, 1fr) var(--chatw, minmax(360px, 1.05fr)); }
  .discuss-grid .col-split { display: block; position: absolute; top: 0; bottom: 0; right: -13px; width: 10px; z-index: 1; cursor: ew-resize; touch-action: none; }
  .col-split::after { content: ""; position: absolute; top: 12px; bottom: 12px; left: 4px; width: 2px; border-radius: 1px; transition: background-color 150ms ease; }
  .col-split:hover::after, .col-split:focus-visible::after, .col-split.dragging::after { background: var(--accent); }
  .col-split:focus-visible { outline: none; }
  .discuss-grid.nochat .col-split { display: none; }
  .discuss-grid.resizing { user-select: none; }
  .discuss-grid.nochat { grid-template-columns: 220px minmax(0, 1fr); }
}
.discuss-grid.nochat .chat { display: none; }
.dmain { position: relative; }
.col-split { display: none; }
.col { display: flex; flex-direction: column; min-height: 0; }
.col-now .progress { border-top: 1px solid var(--line); padding-top: 14px; margin: 16px 0 0; }
.stack { gap: 16px; }
.stack > .card + .card { margin: 0; }
/* questions of the open questions file, open first */
.qitem { display: flex; gap: 8px; align-items: baseline; width: 100%; text-align: left; border: 1px solid transparent; background: none; border-radius: 8px; padding: 6px 8px; font-size: 13px; }
.qitem .qid { font-weight: 700; white-space: nowrap; }
.qitem .qt { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.qitem.closed { color: var(--muted); }
.qitem.on { background: var(--cb); border-color: color-mix(in srgb, var(--c) 40%, transparent); }
@media (hover: hover) and (pointer: fine) { .qitem:hover { background: var(--panel2); } }
.qst { font-size: 11px; font-weight: 600; padding: 0 7px; border-radius: 999px; white-space: nowrap; background: var(--wait-bg); color: var(--wait); }
.qst.open { background: var(--q-bg); color: var(--q); }
.qst.prov { background: var(--oa-bg); color: var(--oa); }
.cnt.q { background: var(--q-bg); color: var(--q); font-weight: 700; }
.qst.decided { background: var(--done-bg); color: var(--done); }
.qbody { font-size: 14px; overflow-wrap: anywhere; }
.qbody p { margin: 0 0 10px; }
.qbody code { background: var(--code-bg); border-radius: 4px; padding: 0 4px; }
.qbody pre { background: var(--code-bg); border-radius: 6px; padding: 8px 10px; overflow-x: auto; white-space: pre-wrap; }
.qbody pre code { background: none; padding: 0; }
.tbl { overflow-x: auto; margin: 0 0 10px; }
.tbl table { border-collapse: collapse; font-size: 13px; overflow-wrap: normal; }
.tbl th, .tbl td { border: 1px solid var(--line); padding: 4px 8px; text-align: left; vertical-align: top; }
.tbl th { background: var(--panel2); font-weight: 600; }
.qdecision { margin-top: 12px; padding: 10px 12px; border-radius: 8px; background: var(--done-bg); }
.dlist h2 { margin-top: 14px; }
.dlist button.qitem { display: flex; padding: 6px 8px; margin-bottom: 2px; }
.dlist .qt { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.a-view.full { position: fixed; inset: 0; z-index: 15; border-radius: 0; display: flex; flex-direction: column; }
.a-view.full #view { flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: auto; }
.a-view.full .graph-box { flex: 1; min-height: 0; max-height: none; overflow: hidden; }
/* app layout: a window large enough shows a project without page scroll; long lists scroll in their card */
@media (min-width: 900px) and (min-height: 600px) {
  body.app { height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
  body.app #repoview { flex: 1; min-height: 0; display: flex; flex-direction: column; padding-bottom: 16px; }
  body.app .pane { flex: 1; min-height: 0; }
  body.app .status-grid, body.app .discuss-grid, body.app .chat-grid { grid-template-rows: minmax(0, 1fr); }
  body.app .chat-side { min-height: 0; }
  body.app .convs { flex: 1; min-height: 0; }
  /* Now: the task, its phases, the progress and the plan usage stay in place; the details scroll */
  /* (#now's children are the card's own; the card scrolls only when even that does not fit) */
  body.app .col-now { overflow: auto; flex: 1 1 auto; }
  body.app #now { display: contents; }
  body.app .col-now > * { flex: none; }
  body.app .col-now .now-body { flex: 0 1 auto; min-height: 4.5em; overflow: auto; }
  /* needs you takes what it needs (at most two thirds), the questions the rest */
  body.app .col-att { flex: 0 1 auto; max-height: 66%; }
  body.app .col-q { flex: 1 1 0; min-height: 140px; }
  body.app .dlist { overflow: auto; }
  body.app .scroll { flex: 1; min-height: 0; overflow: auto; }
  body.app #pv-work { display: flex; flex-direction: column; }
  body.app #viewcard { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  body.app #view { flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: auto; }
  body.app #view.v-graph { overflow: hidden; }
  body.app .graph-box { flex: 1; min-height: 0; max-height: none; overflow: hidden; }
  body.app pre.log { flex: 1; min-height: 0; max-height: none; }
}
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; box-shadow: var(--shadow); min-width: 0; }
.card + .card { margin-top: 16px; }
.pane > .card, .pane > .card + .card { margin: 0; }

/* decisions: gates, questions, provisional decisions, explained */
.dc { border: 1px solid color-mix(in srgb, var(--c) 35%, transparent); background: color-mix(in srgb, var(--cb) 70%, var(--panel)); border-radius: 10px; padding: 12px 14px; margin-bottom: 12px; }
.dc-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; }
.dc-label { font-size: 10.5px; font-weight: 800; letter-spacing: .1em; color: var(--c); }
.dc-head b { font-size: 15px; }
.dc .lbl { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; margin: 10px 0 3px; }
.dc .txt { font-size: 13.5px; overflow-wrap: anywhere; white-space: pre-wrap; }
.dc .txt.clamp { display: -webkit-box; -webkit-line-clamp: 6; -webkit-box-orient: vertical; overflow: hidden; }
.dc .two { display: grid; gap: 4px 14px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 1200px) { .dc .two { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } }
.dc .acts { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; margin-top: 12px; }
.dc .acts .cmd { flex: 1 1 320px; margin-top: 0; }
.dc details { margin-top: 6px; font-size: 12.5px; }
.dc details summary { cursor: pointer; color: var(--muted); }
.dc.full { border: 0; background: none; padding: 0; margin: 0; }
.dc.full .dc-head b { font-size: 19px; }
.v-agree { color: var(--done); font-weight: 700; } .v-amend { color: var(--q); font-weight: 700; }
.v-counter, .v-escalate { color: var(--bad); font-weight: 700; }
button.ask { background: var(--ink); color: var(--panel); border-color: var(--ink); font-weight: 600; font-size: 13px; padding: 5px 12px; }
.dlist button { display: block; width: 100%; text-align: left; border-color: transparent; background: none; padding: 8px 10px; margin-bottom: 4px; font-size: 13px; }
.dlist button.on { background: var(--cb); border-color: color-mix(in srgb, var(--c) 40%, transparent); }
.dlist .back { color: var(--accent); margin-bottom: 10px; }

/* discussion with Claude */
.chat { padding: 0; overflow: hidden; }
.chat-head { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.chat-head b { font-size: 15px; }
.ro { font-size: 11.5px; font-weight: 600; color: var(--done); background: var(--done-bg); border-radius: 999px; padding: 1px 9px; }
.chatlog { padding: 14px 16px; display: flex; flex-direction: column; gap: 12px; }
.msg-u { align-self: flex-end; max-width: 85%; background: var(--ink); color: var(--panel); border-radius: 12px 12px 4px 12px; padding: 8px 12px; white-space: pre-wrap; overflow-wrap: anywhere; }
.msg-a { max-width: 96%; overflow-wrap: anywhere; font-size: 14px; }
.msg-a p { margin: 0 0 8px; } .msg-a p:last-child { margin-bottom: 0; }
.msg-a pre { background: var(--code-bg); border-radius: 6px; padding: 8px 10px; overflow-x: auto; white-space: pre-wrap; margin: 0 0 8px; }
.msg-a code { background: var(--code-bg); border-radius: 4px; padding: 0 4px; }
.msg-a pre code { background: none; padding: 0; }
.tools { display: flex; flex-wrap: wrap; gap: 6px; }
.tool { font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; font-size: 11.5px; color: var(--muted); background: var(--code-bg); border-radius: 6px; padding: 2px 8px; overflow-wrap: anywhere; }
.proposal { border: 1px solid color-mix(in srgb, var(--accent) 35%, transparent); background: color-mix(in srgb, var(--run-bg) 60%, var(--panel)); border-radius: 10px; padding: 10px 12px; }

/* chats of the repository: the list and plan usage on the left, the chat on the right */

.usage .meter + .meter { margin-top: 14px; }

.meter .track { height: 10px; border-radius: 5px; background: var(--line); overflow: hidden; margin: 5px 0 4px; }
.meter .fill { display: block; height: 100%; border-radius: 5px; background: var(--run); }
.meter.warn .fill { background: var(--q); } .meter.warn .pct { color: var(--q); }
.meter.full .fill { background: var(--bad); } .meter.full .pct { color: var(--bad); }
.meter .pct { font-weight: 700; }
.mc-title { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.mc-title .small { overflow-wrap: anywhere; }
.ctx { width: 220px; display: flex; flex-direction: column; gap: 4px; font-size: 12px; }
.ctx .ch { display: flex; align-items: baseline; gap: 6px; }
.ctx .ch span:nth-child(2) { flex: 1; color: var(--muted); }

.ctx.warn .fill { background: var(--q); } .ctx.full .fill { background: var(--bad); }
button.desk { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; padding: 6px 12px; }
.mtools { display: flex; flex-direction: column; gap: 3px; font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; font-size: 12px; color: var(--muted); }
.mtools span { overflow-wrap: anywhere; }
.mtools .r { color: var(--ink); opacity: .75; }
.mtools .bad { color: var(--bad); }
.msg-u.queued { opacity: .55; }
.msg-u.dropped { opacity: .4; text-decoration: line-through; }
.msg-u .qn { display: block; font-size: 11px; opacity: .8; margin-top: 2px; }
.startcard { border: 1px solid color-mix(in srgb, var(--accent) 35%, transparent); background: color-mix(in srgb, var(--run-bg) 60%, var(--panel)); border-radius: 10px; padding: 10px 14px; margin-top: 8px; }
.startcard .dc-label { color: var(--accent); }

.mc-opts { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; font-size: 12.5px; }
.mc-opts label { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); }
.mc-opts select { font: inherit; color: var(--ink); background: var(--panel2); border: 1px solid var(--line); border-radius: 7px; padding: 3px 6px; }

.looptag { display: inline-flex; align-items: center; gap: 7px; font-weight: 600; color: var(--run); background: var(--run-bg); border-radius: 999px; padding: 3px 12px; }
.looptag.other { color: var(--muted); background: var(--wait-bg); }
button.stopbtn { color: var(--bad); font-weight: 600; padding: 9px 14px; }
.graph-box.panning { cursor: grabbing; }
@media (min-width: 900px) and (min-height: 600px) { body.app .graph-box { cursor: grab; } }

/* status colours */
.k-done { --c: var(--done); --cb: var(--done-bg); }
.k-running, .k-interrupted { --c: var(--run); --cb: var(--run-bg); }
.k-ready { --c: var(--ready); --cb: var(--ready-bg); }

.k-blocked-question { --c: var(--q); --cb: var(--q-bg); }
.k-blocked-owner_action { --c: var(--oa); --cb: var(--oa-bg); }
.k-blocked-harness { --c: var(--bad); --cb: var(--bad-bg); }
.k-gate-open { --c: var(--gate); --cb: var(--gate-bg); }
.badge { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 11.5px; font-weight: 600; background: var(--cb); color: var(--c); white-space: nowrap; }
.chip { display: inline-block; padding: 1px 7px; margin: 2px 3px 2px 0; border-radius: 6px; font-size: 12px; font-weight: 600; background: var(--cb); color: var(--c); border: 1px solid transparent; cursor: pointer; }

/* now */
.now-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 12px; }
.now-head .tid { font-size: 20px; font-weight: 700; }
.now-head .ttl { font-size: 16px; }
.phases { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 12px 0 8px; }
.phase { padding: 5px 11px; border-radius: 8px; background: var(--panel2); border: 1px solid var(--line); color: var(--muted); font-size: 12.5px; }
.phase.past { color: var(--done); border-color: transparent; background: var(--done-bg); }
.phase.cur { position: relative; color: #fff; background: var(--run); border-color: var(--run); font-weight: 600; }

.phase.cur::after { content: ""; position: absolute; inset: -1px; border-radius: inherit; box-shadow: 0 0 0 4px var(--run-bg); opacity: 0; animation: pulse 2s ease-in-out infinite; pointer-events: none; }
.phase.alt { border-style: dashed; }
@keyframes pulse { 50% { opacity: 1; } }
.arrow { color: var(--muted); }
.kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 3px 14px; font-size: 13px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; overflow-wrap: anywhere; }

/* tabs and views */
.tabs { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 12px; }
.tabs .spacer { flex: 1; }
/* a narrow window scrolls the page, never the graph box too; the app layout fits the graph to the box */
.graph-box { user-select: none; -webkit-user-select: none; display: flex; overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--panel2); min-height: 160px; }
svg.graph { display: block; flex: none; margin: auto; }
/* room on the right as wide as the details panel covers: the last tasks can be scrolled past it */
.graph-box .gpad { flex: none; }
.node .box { fill: var(--panel); stroke: var(--line); stroke-width: 1.2; }
.node rect.stripe { fill: var(--c); }
.node.k-done .box { fill: var(--cb); stroke: transparent; }
.node.k-gate-open .box, .node.k-gate-wait .box { stroke-dasharray: 5 3; stroke: var(--c); stroke-width: 1.6; }
.node.k-gate-open .box { fill: var(--cb); }
.node.k-blocked-question .box, .node.k-blocked-owner_action .box, .node.k-blocked-harness .box { stroke: var(--c); stroke-width: 1.8; fill: var(--cb); }
.node.k-running .box { stroke: var(--run); stroke-width: 2.4; animation: glow 1.6s infinite; }
.node.k-ready .box { stroke: var(--ready); stroke-width: 1.6; }
@keyframes glow { 50% { stroke-width: 5; stroke-opacity: .55; } }
.node text { fill: var(--ink); font-size: 12px; }
.node text.id { font-weight: 700; font-size: 12.5px; }
.node text.st { fill: var(--c); font-size: 11px; font-weight: 600; }
.node text.ag { fill: var(--muted); font-size: 10.5px; }
.node { cursor: pointer; }
.node.sel .box { stroke: var(--accent); stroke-width: 3; }
/* gates: a hexagon in the gate colour, never mistaken for a task */
.node.gate .box { fill: var(--gate-bg); stroke: var(--gate); stroke-width: 2.4; stroke-dasharray: none; }
.node.gate.k-gate-wait .box { fill: var(--panel); stroke-dasharray: 7 4; stroke-width: 1.8; }
.node.gate.k-done .box { fill: var(--done-bg); stroke: var(--done); stroke-width: 1.8; }
.node.gate.k-gate-open .box { animation: gateglow 1.8s infinite; }
.node.gate.sel .box { stroke: var(--accent); stroke-width: 3; }
@keyframes gateglow { 50% { stroke-width: 5.5; } }
.node.gate text.gl { fill: var(--gate); font-size: 9.5px; font-weight: 800; letter-spacing: .12em; }
.node.gate.k-done text.gl { fill: var(--done); }
.node.gate.k-gate-wait text.gl { fill: var(--wait); }
tr.gate-row td:first-child { box-shadow: inset 3px 0 0 var(--gate); }
.chip.gate { border-style: dashed; border-color: var(--gate); }
.edge { fill: none; stroke: var(--wait); stroke-width: 1.4; opacity: .7; transition: opacity 120ms ease; }
.node { transition: opacity 120ms ease; }
.edge.done { stroke: var(--done); opacity: .55; }
.edge.open { stroke-dasharray: 4 3; }
.graph.hl .node:not(.on) { opacity: .25; }
.graph.hl .edge:not(.on) { opacity: .08; }
.graph.hl .edge.on { opacity: 1; stroke-width: 2.2; }
.zoom button { padding: 2px 9px; }

table.tasks { width: 100%; border-collapse: collapse; font-size: 13px; }
table.tasks th { text-align: left; color: var(--muted); font-weight: 600; font-size: 12px; border-bottom: 1px solid var(--line); padding: 6px 8px; white-space: nowrap; }

.table-box { overflow-x: auto; }
input.search { font: inherit; color: inherit; background: var(--panel); border: 1px solid var(--line); border-radius: 7px; padding: 4px 10px; min-width: 0; width: 180px; }

pre.log { margin: 0; max-height: 70vh; overflow: auto; background: var(--code-bg); border-radius: 8px; padding: 10px 12px; white-space: pre-wrap; overflow-wrap: anywhere; }

.log .hl-q { color: var(--q); }
.log .hl-ok { color: var(--done); }

.list-row:last-child { border-bottom: 0; }

.list-row .what { min-width: 0; overflow-wrap: anywhere; flex: 1; }

.att .t { font-weight: 700; color: var(--c); }
.att .b { margin-top: 3px; overflow-wrap: anywhere; font-size: 13px; }
.att .b.clamp { display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
.cmd { display: flex; align-items: center; gap: 6px; margin-top: 6px; background: var(--code-bg); border-radius: 6px; padding: 4px 6px 4px 9px; }
.cmd code { flex: 1; min-width: 0; overflow-wrap: anywhere; font-size: 12px; }
.cmd button { padding: 1px 8px; font-size: 11.5px; }
.ok-msg { color: var(--done); font-weight: 600; }

/* events */
.ev { display: flex; gap: 8px; padding: 5px 0; border-bottom: 1px solid var(--line); font-size: 12.8px; }
.ev:last-child { border-bottom: 0; }
.ev .tm { color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.ev .tx { overflow-wrap: anywhere; min-width: 0; }
.ev.e-bad .tx { color: var(--bad); font-weight: 600; }
.ev.e-warn .tx { color: var(--q); }
.ev.e-good .tx { color: var(--done); }
.ev.e-res .tx { color: var(--oa); }
.ev.e-own .tx { color: var(--gate); }
.ev.e-new { animation: flash 2.5s; }
@keyframes flash { 0% { background: var(--run-bg); } 100% { background: transparent; } }

/* drawer and modal */
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(560px, 100vw); background: var(--panel); border-left: 1px solid var(--line); box-shadow: -8px 0 24px rgba(0,0,0,.12); z-index: 20; display: flex; flex-direction: column; overflow: hidden; }
/* the task's head (Close, title, status, attempts) stays; the details scroll under it */
.drawer .dhead { flex: none; padding: 16px 18px 12px; border-bottom: 1px solid var(--line); }
.drawer .dbody { flex: 1 1 auto; min-height: 0; overflow: auto; padding: 0 18px 40px; }
.drawer[hidden], .modal[hidden] { display: none; }
/* enter: drawer slides from its edge, modal fades and settles from 0.96; exit is instant (faster than enter) */
.drawer { transition: transform 280ms var(--ease-drawer); }
@starting-style { .drawer { transform: translateX(100%); } }
.modal { transition: opacity 200ms var(--ease-out); }
.modal .inner { transition: opacity 200ms var(--ease-out), transform 200ms var(--ease-out); }
@starting-style { .modal { opacity: 0; } .modal .inner { opacity: 0; transform: scale(0.96); } }
.drawer .close, .modal .close { float: right; }
.drawer h3 { margin: 4px 0 4px; font-size: 18px; }
.sec { margin-top: 16px; }
.sec h4 { margin: 0 0 6px; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.prewrap { white-space: pre-wrap; overflow-wrap: anywhere; }
.box-text { background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px; font-size: 13px; }
.modal { position: fixed; inset: 0; background: rgba(8,12,20,.55); z-index: 30; display: flex; align-items: center; justify-content: center; padding: 16px; }
.modal .inner { background: var(--panel); border-radius: 12px; width: min(980px, 100%); max-height: 90vh; display: flex; flex-direction: column; overflow: hidden; }
.modal .mh { padding: 10px 14px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 10px; }
.modal .mh b { flex: 1; overflow-wrap: anywhere; }
.modal pre { margin: 0; padding: 14px 18px; overflow: auto; white-space: pre-wrap; overflow-wrap: anywhere; font: 13.5px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
.empty { color: var(--muted); padding: 18px 4px; }
@media (prefers-reduced-motion: reduce) {
  /* fewer, gentler: keep colour and opacity, drop movement and the endless pulses */

  .drawer, .modal .inner { transition: opacity 150ms ease; }
  @starting-style { .drawer { transform: none; opacity: 0; } .modal .inner { transform: none; } }
  button:active, .rtab:active, .chip:active { transform: none; }
}
@media (max-width: 600px) {
  .repohead h1, .ov-top h1 { font-size: 17px; }
  .rtabs { order: 5; flex: 1 1 100%; flex-wrap: nowrap; overflow-x: auto; padding-bottom: 2px; }
  .rtab { flex: none; }
  .now-head .tid { font-size: 17px; }
  input.search { width: 100%; }
}

    </section>
  </div>
  <div id="pv-status" class="pane status-grid">
    <div class="col stack">
      <section class="card col col-now">
        <div id="now"></div>
        <section class="progress">
          <h2>Progress</h2>
          <div id="bar" class="bar-seg"></div>
          <div id="legend" class="legend"></div>
          <div id="stats" class="stats"></div>
        </section>
        <section class="progress st-usage" id="stusage"><h2>Plan usage</h2><div id="usage2"></div></section>
      </section>
    </div>
    <div class="col stack">
      <section class="card col col-att"><h2 id="atthead">Needs you</h2><div id="attention" class="scroll"></div></section>
      <section class="card col col-q"><h2 id="qhead">Questions</h2><div id="questions" class="scroll"></div></section>
    </div>
    <section class="card col"><h2>Events</h2><div id="events" class="scroll"></div></section>
  </div>
  <div id="pv-work" class="pane" hidden>
    <section class="card a-view" id="viewcard">
      <div class="tabs" id="tabs"></div>
      <div id="view"></div>
    </section>
  </div>
  <div id="pv-discuss" class="pane discuss-grid" hidden>
    <nav class="card col dlist" id="dlist" aria-label="Decisions"></nav>
    <section class="card col dmain"><div id="ddetail" class="scroll"></div>
      <div id="dsplit" class="col-split" role="separator" aria-orientation="vertical" aria-label="Resize the discussion (double-click: back to the default)" tabindex="0"></div></section>
    <section class="card col chat" aria-label="Discussion with Claude">
      <div class="chat-head"><b id="chattitle">Discuss with Claude</b><span class="spacer"></span>
        <span class="ro" title="Claude can read the repository (Read, Grep, Glob) and nothing else">read-only</span>
        <button id="chatnew" title="Start this discussion again">New</button>
        <button id="chathide" title="Hide the discussion: the question takes the room" hidden>Hide</button></div>
      <div id="chatlog" class="scroll chatlog" aria-live="polite"></div>
      <div id="chatsplit" class="chat-split" role="separator" aria-orientation="horizontal" aria-label="Resize the message box" tabindex="0"></div>
      <form id="chatform" class="chat-form">
        <div class="chat-row"><textarea id="chatin" rows="2" aria-label="Your message" placeholder="Ask, or say what you would decide (Ctrl+Enter sends)"></textarea>
          <button type="submit" id="chatsend" class="active">Send</button></div>
      </form>
    </section>
  </div>
</div>
<div id="drawer" class="drawer" hidden></div>
<div id="modal" class="modal" hidden></div>

<script>
"use strict";
const SNAP = window.LAOP_SNAPSHOT || null;
const POLL_MS = 2000, STALL_MIN = 15;
// the tabs of the Logs view (the graph has a view of its own)
const TABS = [["tasks", "Tasks"], ["log", "Loop log"], ["commits", "Commits"], ["files", "Files"]];
const KINDS = {
  "done": "Done", "running": "Running", "interrupted": "In progress, no step", "ready": "Ready",
  "waiting": "Waiting", "blocked-question": "Blocked: question", "blocked-owner_action": "Blocked: owner action",
  "blocked-harness": "Blocked: harness", "gate-open": "Gate: awaiting you", "gate-wait": "Gate: not reached",
};
const ORDER = ["done", "running", "interrupted", "ready", "gate-open", "blocked-question", "blocked-owner_action", "blocked-harness", "waiting", "gate-wait"];
const OT = "python harness/owner_tools.py";

let data = null, etag = null, lastOk = 0, failing = false, selected = null, seenEvents = null;
let repos = [], ovEtag = null, active = null, prevEvents = {};
let logTab = TABS.some(([k]) => k === store("tab")) ? store("tab") : "tasks", tab = "graph";
let zoomMode = store("zoom") || "fit", shownZoom = 1, hover = null;
let tfilter = "all", tquery = "", notifyOn = store("notify") === "1";
// project view: "chat", "status", "discuss" (the decisions and questions, a discussion with Claude),
// "graph" or "logs" (tasks, loop log, commits, files); "work" was the graph and the logs together
let pview = { work: logTab === store("tab") ? "logs" : "graph", chat: "chat", graph: "graph", logs: "logs" }[store("pview")] || "status";
let discuss = null, chat = null, chatPolling = false;
/* the chats of the active repository: list, the one shown, plan usage, the choices offered */
const cv = { list: [], discussions: [], plan: {}, options: null, cur: null, conv: null, polling: false };

function store(k, v) {
  try { if (v === undefined) return localStorage.getItem("laop-viewer-" + k); localStorage.setItem("laop-viewer-" + k, v); }
  catch (e) { return null; }
}
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const nowS = () => Date.now() / 1000;
/** Replace an element's HTML only when it changed (ignoring the ticking time labels): keeps
 *  scroll positions, open <details> and hover state across polls. */
function setHTML(el, html) {
  const key = html.replace(/(data-(?:ago|since)="[^"]*"[^>]*>)[^<]*/g, "$1");
  if (el._key === key) return false;
  el._key = key; el.innerHTML = html; return true;
}
function dur(s) {
  s = Math.max(0, Math.round(s));
  if (s < 60) return s + "s";
  if (s < 3600) return Math.floor(s / 60) + "m " + String(s % 60).padStart(2, "0") + "s";
  return Math.floor(s / 3600) + "h " + String(Math.floor(s % 3600 / 60)).padStart(2, "0") + "m";
}
const ago = (t) => t ? dur(nowS() - t) + " ago" : "";
function parseLocal(s) { const d = new Date(s.replace(" ", "T")); return isNaN(d) ? null : d.getTime() / 1000; }
function parseEvent(e) {
  const m = /^(\d{4}-\d\d-\d\d \d\d:\d\d:\d\d)\s+([\s\S]*)$/.exec(e);
  return m ? { time: parseLocal(m[1]), stamp: m[1], text: m[2] } : { time: null, stamp: "", text: e };
}

/* ------------------------------------------------------------ derived state */

function kindOf(t, d = data) {
  const s = t.st.status, cur = d.state.current;
  if (s === "done") return "done";
  if (t.gate) return s === "awaiting_owner" || !t.waiting_on.length ? "gate-open" : "gate-wait";
  if (s === "blocked") return "blocked-" + (["question", "owner_action", "harness"].includes(t.st.block_type) ? t.st.block_type : "question");
  if (s === "in_progress") return cur && cur.task_id === t.id ? "running" : "interrupted";
  return t.waiting_on.length ? "waiting" : "ready";
}
function loopStatus(d = data) {
  const st = d.state, all = d.tasks.length && d.tasks.every((t) => t.st.status === "done");
  if (d.stops.emergency) return ["kill", "EMERGENCY STOP"];
  if (st.halted) return ["halted", "HALTED"];
  if (st.loop_active && d.stops.hard) return ["soft", "STOPPING (handoff)"];
  if (st.loop_active) return d.stops.soft ? ["soft", "FINISHING (soft stop)"] : ["running", "RUNNING"];
  if (all) return ["complete", "MILESTONE COMPLETE"];
  if (st.current) return ["paused", "STOPPED MID-TASK"];
  return ["idle", "IDLE"];
}
const byId = (id, d = data) => d.tasks.find((t) => t.id === id);
function dispatchTime(id, d = data) {
  const evs = d.state.events.map(parseEvent);
  for (let i = evs.length - 1; i >= 0; i--) if (evs[i].text.startsWith("dispatch " + id + " to")) return evs[i].time;
  return null;
}
function phaseInfo(cur, d = data) {
  const p = cur.phase;
  const start = p === "dispatched" ? dispatchTime(cur.task_id, d) || (byId(cur.task_id, d)?.time || {}).open_since : p === "awaiting_review" ? cur.verify_time
    : p === "resolving" ? cur.resolve_time : p === "challenging" ? cur.challenge_time : null;
  const hb = d.heartbeat, lock = d.step_lock_age;
  let who = { dispatched: cur.agent, awaiting_review: cur.reviewer, resolving: "resolver", challenging: "challenger" }[p] || "?";
  let checking = false;
  if (lock !== null && lock !== undefined && hb && /step_verify/.test(hb.command || "")) { checking = true; who = "step_verify (checks)"; }
  return { start, who, checking };
}

/* ------------------------------------------------------------ rendering */

function cmd(text) {
  return `<div class="cmd"><code>${esc(text)}</code><button data-copy="${esc(text)}">Copy</button></div>`;
}
function chip(id) {
  const t = byId(id);
  return t ? `<span class="chip k-${kindOf(t)} ${t.gate ? "gate" : ""}" data-task="${esc(id)}" title="${esc(t.title)} · ${esc(KINDS[kindOf(t)])}">${t.gate ? "◆ " : ""}${esc(id)}</span>`
    : `<span class="chip k-blocked-harness">${esc(id)}?</span>`;
}
function kindBadge(t) { const k = kindOf(t); return `<span class="badge k-${k}">${esc(KINDS[k])}</span>`; }

function renderHeader() {
  const d = data, p = d.project, [cls, word] = loopStatus();
  $("#pname").textContent = p.name || "Loop";
  $("#meta").textContent = [d.milestone && "milestone " + d.milestone, d.branch && "branch " + d.branch, d.head, p.version && "laop " + p.version].filter(Boolean).join(" · ");
  const pill = $("#pill"); pill.className = "pill " + cls; pill.textContent = word;
  setHTML($("#stops"), SNAP ? "" : stopButtons(active, d.stops, ""));
  const n = needsOf(d).n, nq = questionsDoc(d).filter((q) => q.open || q.provisional).length;
  const working = cv.list.some((c) => c.busy);
  const ptab = (v, label, extra = "") => `<button data-pview="${v}" class="${pview === v ? "on" : ""}">${label}${extra}</button>`;
  setHTML($("#ptabs"), (SNAP ? "" : ptab("chat", `${working ? `<span class="cdot busy" title="Claude is working in a chat"></span>` : ""}Chat`)) +
    ptab("status", "Status", n ? ` <span class="cnt" title="needs you">${n}</span>` : "") +
    ptab("discuss", "Questions", nq ? ` <span class="cnt q" title="open or to ratify">${nq}</span>` : "") +
    ptab("graph", "Graph") + ptab("logs", "Logs"));
  $("#nowline").hidden = pview === "status";
  setHTML($("#nowline"), "Now: " + nowText(d, cls));
  $("#nowline").title = $("#nowline").textContent;
  const cur = d.state.current;
  document.title = `${word}${cur ? " · " + cur.task_id : ""} · ${p.name || "loop"}`;
  setFavicon(cls);
}

function renderProgress() {
  const counts = {};
  data.tasks.forEach((t) => { const k = kindOf(t); counts[k] = (counts[k] || 0) + 1; });
  const n = data.tasks.length || 1;
  setHTML($("#bar"), ORDER.filter((k) => counts[k]).map((k) =>
    `<span class="k-${k}" style="width:${100 * counts[k] / n}%;background:var(--c)" title="${esc(KINDS[k])}: ${counts[k]}"></span>`).join(""));
  setHTML($("#legend"), ORDER.filter((k) => counts[k]).map((k) =>
    `<span class="k-${k}"><i style="background:var(--c)"></i>${esc(KINDS[k])} <b>${counts[k]}</b></span>`).join(""));
  const s = data.state, p = data.project, hb = data.heartbeat, done = counts.done || 0;
  const items = [
    `<span><b>${done}/${data.tasks.length}</b> done</span>`,
    `<span>dispatches <b>${s.iterations}/${p.max_iterations}</b></span>`,
    (() => {
      const ts = data.tasks.map(timeOf), open = ts.find((x) => x.open), base = ts.reduce((a, x) => a + x.base, 0);
      return `<span>work time <b ${open ? `data-since="${open.open}" data-base="${base}"` : ""}>${dur(ts.reduce((a, x) => a + x.work, 0))}</b></span>`;
    })(),
  ];
  if (p.resolver && p.resolver.enabled) items.push(`<span>resolutions this run <b>${s.resolutions_this_run}/${p.resolver.max_per_run ?? "?"}</b></span>`);
  else items.push(`<span>resolver <b>off</b></span>`);
  if (hb) items.push(`<span title="${esc(hb.command || "")}">last tool call <b data-ago="${hb.time}">${ago(hb.time)}</b> · ${esc(hb.agent_type || "main session")} · ${esc(hb.tool || "")}</span>`);
  items.push(`<span>orchestrator <b>${s.bound ? "bound" : "none"}</b></span>`);
  setHTML($("#stats"), items.join(""));
}

function renderNow() {
  const cur = data.state.current, el = $("#now"), [cls, word] = loopStatus();
  if (!cur) {
    let msg = { running: "Between steps: the orchestrator is choosing the next task.", complete: "Every task is done.",
      halted: "The loop is halted: see Needs you.", kill: "AGENT_EMERGENCY_STOP is present: every tool call is blocked.",
      idle: "No task in flight. The loop is not running." }[cls] || "";
    const ready = data.tasks.filter((t) => kindOf(t) === "ready");
    if (cls === "idle" && ready.length) msg += ` ${ready.length} task(s) ready: type /${esc(data.project.loop_command || "loop")} in the loop session to continue.`;
    setHTML(el, `<h2>Now</h2><div class="now-body"><div class="muted">${msg}</div>` +
      (data.state.last_task ? `<div class="small muted" style="margin-top:6px">Last task: ${chip(data.state.last_task)}</div>` : "") + "</div>");
    return;
  }
  const t = byId(cur.task_id) || { id: cur.task_id, title: "", st: {} };
  const info = phaseInfo(cur), p = cur.phase;
  const seq = p === "resolving" || p === "challenging"
    ? [["dispatched", "Agent: " + cur.agent], ["q", "Question"], ["resolving", "Resolver"], ["challenging", "Challenger"], ["back", "Task resumes or owner"]]
    : [["dispatched", "Agent: " + cur.agent], ["checks", "Checks"], ["awaiting_review", "Review: " + (cur.reviewer || "evaluator")], ["end", "Done or retry"]];
  const curKey = info.checking ? "checks" : p;
  const idx = seq.findIndex((s) => s[0] === curKey);
  const phases = seq.map((s, i) => `<span class="phase ${i < idx ? "past" : i === idx ? "cur" : ""}">${esc(s[1])}</span>`).join('<span class="arrow">→</span>');
  const maxA = data.project.max_attempts_per_task;
  const claim = data.claim && data.claim.task_id === cur.task_id ? data.claim : null;
  const firstDispatch = dispatchTime(cur.task_id);
  setHTML(el, `<h2>Now${cls !== "running" ? " · " + esc(word) : ""}</h2>
    <div class="now-head"><span class="tid">${esc(t.id)}</span><span class="ttl" title="${esc(t.title)}">${esc(t.title)}</span>${t.st ? kindBadge(t) : ""}</div>
    <div class="phases">${phases}</div>
    <div class="now-body"><dl class="kv">
      <dt>Working</dt><dd><b>${esc(info.who)}</b>${info.start ? ` for <b data-since="${info.start}">${dur(nowS() - info.start)}</b>` : ""}</dd>
      <dt>Attempt</dt><dd>${cur.attempt ?? "?"} of ${maxA}</dd>
      ${t.time && timeOf(t).work >= 1 ? `<dt>Task time</dt><dd>${timeSpan(t)} of work over ${timeOf(t).dispatches} dispatch(es)</dd>` : ""}
      ${firstDispatch && p !== "dispatched" ? `<dt>Dispatched</dt><dd><span data-ago="${firstDispatch}">${ago(firstDispatch)}</span></dd>` : ""}
      ${cur.question_id ? `<dt>Question</dt><dd>${esc(cur.question_id)}${cur.resolution ? ` · <a data-file="${esc(cur.resolution)}">${esc(cur.resolution)}</a>` : ""}</dd>` : ""}
      ${cur.verdict ? `<dt>Verdict file</dt><dd><a data-file="${esc(cur.verdict)}">${esc(cur.verdict)}</a></dd>` : ""}
      ${cur.spawn && cur.spawn.prompt_file ? `<dt>Prompt</dt><dd><a data-file="${esc(cur.spawn.prompt_file)}">${esc(cur.spawn.prompt_file)}</a></dd>` : ""}
      ${claim ? `<dt>Claim</dt><dd><b>${esc(claim.status)}</b>: ${esc(claim.summary || "")}</dd>` : ""}
    </dl>
    <div style="margin-top:8px"><a data-task="${esc(t.id)}">Task details</a></div></div>`);
}

function attentionItems() {
  const d = data, st = d.state, out = [];
  const box = (k, title, body, cmds = [], clamp = false) =>
    out.push(`<div class="att k-${k}"><div class="t">${title}</div>${body ? `<div class="b ${clamp ? "clamp" : ""}">${body}</div>` : ""}${cmds.map(cmd).join("")}</div>`);
  if (d.stops.emergency) box("blocked-harness", "Emergency stop", "AGENT_EMERGENCY_STOP is present: every tool call of every session is blocked until you delete the file at the repository root.");
  if (d.stops.hard) box("blocked-question", "Stop requested", "AGENT_STOP is present: the task agent commits its work in progress, writes a handoff note and ends (not counted as an attempt); a reviewer or resolver ends without writing; then the loop stops. Delete the file to let the loop go on: the task resumes from the handoff.");
  if (st.halted) box("blocked-harness", "Loop halted", esc(st.halted), [OT + " clear_halt"]);
  if (d.stops.soft) box("blocked-question", "Soft stop requested", "AGENT_SOFT_STOP is present: the loop stops when the agent at work ends (task agent, reviewer, resolver or challenger), and resumes from there. Delete the file to let the loop go on.");
  const hb = d.heartbeat;
  if (st.loop_active && hb && nowS() - hb.time > STALL_MIN * 60)
    box("blocked-question", "No activity", `No tool call for <b data-ago="${hb.time}">${ago(hb.time)}</b> while the loop is active: the session may be stuck, waiting for you, or closed.`);
  // server_stale: viewer.py changed on disk; a task without "time": a server older than this page.
  if (d.server_stale || (d.tasks.length && !("time" in d.tasks[0]))) box("blocked-question", "Viewer server out of date",
    "viewer.py changed after this server started (an update?): some data may be missing. Stop the viewer (Ctrl+C in its terminal) and start it again.");
  d.problems.forEach((p) => box("blocked-harness", "File problem", esc(p)));
  // gates, questions with a recommendation and provisional decisions: explained, with a discussion
  (d.decisions || []).forEach((x) => out.push(decisionCard(x)));
  d.tasks.filter((t) => t.st.status === "blocked" && !(d.decisions && openQuestion(t, d))).forEach((t) => {
    const k = kindOf(t), res = (t.st.resolutions || []).concat(d.files.map((f) => f.path).filter((f) => f.startsWith(`harness/resolutions/${t.id}_`)));
    const links = [...new Set(res)].map((f) => `<a data-file="${esc(f)}">${esc(f.split("/").pop())}</a>`).join(" · ");
    const q = openQuestion(t, d);
    const title = q ? `${esc(t.id)} waits for your decision on ${esc(q[0])}` : `${esc(t.id)} blocked (${esc((t.st.block_type || "question").replace("_", " "))})`;
    const rec = q ? `<br>Recommendation (challenged): <a data-file="${esc(q[1].file)}">${esc(q[1].file.split("/").pop())}</a>${q[1].category ? ` · category ${esc(q[1].category)}` : ""}` : "";
    const cmds = q ? [`${OT} decide qid=${q[0]} verdict=agree`, `${OT} decide qid=${q[0]} verdict=amend note="..."`, `${OT} decide qid=${q[0]} verdict=differ note="..."`]
      : [OT + " unblock task=" + t.id];
    box(k, title,
      `${esc(t.st.blocked_reason || "")}${rec}${t.holds_up.length ? `<br><span class="small">Holds up ${t.holds_up.length} task(s)</span>` : ""}${links && !q ? "<br>" + links : ""} · <a data-task="${esc(t.id)}">details</a>`,
      cmds, true);
  });
  d.tasks.filter((t) => kindOf(t) === "interrupted" && !st.loop_active).forEach((t) =>
    box("running", `${esc(t.id)} interrupted`, "In progress but no step is running: the loop stopped while the task was in flight. Restart the loop to continue it."));
  if (d.queue.length) box("blocked-owner_action", `${d.queue.length} owner action(s) queued`,
    d.queue.map((a) => `<code>${esc(a.action)}</code> ${esc(Object.entries(a).filter(([k]) => !["action", "queued"].includes(k)).map(([k, v]) => k + "=" + v).join(" "))} <span class="small muted">${esc(a.queued || "")}</span>`).join("<br>") + "<br><span class=\"small\">Applied by the next step script.</span>");
  if (st.bound && !st.loop_active && !st.current) box("waiting", "Session still bound as orchestrator",
    "The last loop session keeps the orchestrator restrictions until you type a message in it. If that session is closed:", [OT + " release"]);
  (d.project.external_programs || []).forEach((prog) => {
    const ids = d.tasks.filter((t) => (prog.agents || []).includes(t.agent) && t.st.status !== "done").map((t) => t.id);
    if (ids.length) box("waiting", `${esc(prog.name)} tasks still to run`, ids.map(chip).join("") + (prog.reminder ? `<br>${esc(prog.reminder)}` : ""));
  });
  return out;
}
/** The open question of a blocked task that waits for 'decide' (laop 0.3), as [qid, record]. */
function openQuestion(t, d = data) {
  return Object.entries(d.state.questions || {}).find(([, q]) => q.task === t.id && q.status === "open") || null;
}
function renderAttention() {
  const items = attentionItems(), n = needsOf(data).n;
  $("#atthead").textContent = "Needs you" + (n ? " · " + n : "");
  setHTML($("#attention"), items.length ? items.join("") : `<div class="ok-msg">Nothing needs you right now.</div>`);
}

/* ------------------------------------------------------------ decisions */

const DKIND = { gate: ["OWNER GATE", "gate-open"], question: ["QUESTION", "blocked-question"], provisional: ["PROVISIONAL", "blocked-owner_action"] };
function verdict(v) { return v ? `<span class="v-${esc(v.toLowerCase())}">${esc(v[0] + v.slice(1).toLowerCase())}</span>` : ""; }
/** The owner_tools.py commands of a decision: the usual one first. */
function decisionCmds(x) {
  if (x.kind === "gate") return [OT + " pass_gate task=" + x.id];
  if (x.kind === "question") return [`${OT} decide qid=${x.id} verdict=agree`, `${OT} decide qid=${x.id} verdict=amend note="..."`, `${OT} decide qid=${x.id} verdict=differ note="..."`];
  return [`${OT} ratify qid=${x.id}`, `${OT} override qid=${x.id} note="..."`];
}
/** One gate, question or provisional decision, explained; ``full``: the discussion view (no clamp). */
function decisionCard(x, full = false) {
  const [label, k] = DKIND[x.kind], clamp = full ? "" : "clamp";
  const sec = (title, html) => `<div class="lbl">${title}</div>${html}`;
  const text = (s, fallback) => `<div class="txt ${clamp}">${s ? esc(s) : `<span class="muted">${fallback}</span>`}</div>`;
  const t = byId(x.task), when = x.kind === "gate" ? (t && timeOf(t).ready) : parseLocal(x.time || "");
  const meta = [when ? `<span data-ago="${when}">${ago(when)}</span>` : "", x.holds_up && x.holds_up.length ? "holds up " + x.holds_up.map(chip).join("") : "",
    x.category ? "category " + esc(x.category) : ""].filter(Boolean).join(" · ");
  let title, body;
  if (x.kind === "gate") {
    title = `${esc(x.id)} · ${esc(x.title)}${x.final ? " (final)" : ""}`;
    const deps = x.depends_on || [];
    body = sec("What to check", text(x.description, "No description in tasks.json: open the gate's task.")) +
      sec("What the loop did", `<div class="txt">${deps.length ? `Done before it: ${deps.map(chip).join("")}` : "Nothing before it."}${
        deps.map((i) => byId(i)).filter(Boolean).some((d) => (d.st.resolutions || []).length) ? " Some of them were resolved by the resolver: see their details." : ""}</div>`);
  } else {
    title = x.kind === "question" ? `${chip(x.task)} ${esc(x.title)} is blocked` : `Taken by the resolver for ${chip(x.task)} ${esc(x.title)}`;

/** A small, safe Markdown: escaped first, then code blocks, inline code, bold, tables, paragraphs. */
function md(s) {
  const blocks = [], tables = [];
  let h = esc(s).replace(/```[^\n]*\n([\s\S]*?)```/g, (m, code) => { blocks.push(code); return `\u0000${blocks.length - 1}\u0000`; });
  h = h.replace(/`([^`\n]+)`/g, "<code>$1</code>").replace(/\*\*([^*\n]+)\*\*/g, "<b>$1</b>");
  // a run of lines starting with "|" whose second line is a |---|:--:| separator is a table
  const cells = (row) => row.trim().replace(/^\||\|$/g, "").split(/(?<!\\)\|/).map((c) => c.trim().replace(/\\\|/g, "|"));
  h = h.replace(/(^|\n)((?:[ \t]*\|[^\n]*(?:\n|$))+)/g, (m, pre, t) => {
    const rows = t.trim().split("\n").map(cells);
    if (rows.length < 2 || !rows[1].every((c) => /^:?-+:?$/.test(c))) return m;
    const align = rows[1].map((c) => (c.endsWith(":") ? (c.startsWith(":") ? "center" : "right") : ""));
    const tr = (r, tag) => `<tr>${align.map((a, i) => `<${tag}${a ? ` style="text-align:${a}"` : ""}>${r[i] ?? ""}</${tag}>`).join("")}</tr>`;
    tables.push(`<div class="tbl"><table><thead>${tr(rows[0], "th")}</thead><tbody>${rows.slice(2).map((r) => tr(r, "td")).join("")}</tbody></table></div>`);
    return `${pre}\n\u0001${tables.length - 1}\u0001\n\n`;
  });
  // a line wrapped in the source joins the previous one; a list item or option starts a new line
  h = h.split(/\n{2,}/).filter((p) => p.trim()).map((p) => `<p>${p.replace(/\n(?=\s*(?:[-*•]|\(?[0-9a-z]{1,4}[.)])\s)/gi, "<br>").replace(/\n/g, " ")}</p>`).join("");
  h = h.replace(/<p>\s*\u0001(\d+)\u0001\s*<\/p>/g, (m, i) => tables[i]);
  return h.replace(/\u0000(\d+)\u0000/g, (m, i) => `<pre><code>${blocks[i]}</code></pre>`);
}

/* ------------------------------------------------------------ graph */

const NW = 184, NH = 62, PAD = 18;
/** Layered layout: the level of a task is the length of its longest dependency chain. Levels
 *  run left to right; inside a level, tasks are ordered by the mean position of their
 *  dependencies, to reduce crossings. */
function layout() {
  const GIN = 16, GLV = 70;
  const tasks = data.tasks, idx = Object.fromEntries(tasks.map((t, i) => [t.id, i])), lvl = {};
  const visit = (id, path) => {
    if (id in lvl) return lvl[id];
    if (path.has(id)) return 0;
    path.add(id);
    let l = 0;
    for (const dep of byId(id).depends_on || []) if (dep in idx) l = Math.max(l, visit(dep, path) + 1);
    path.delete(id);
    return (lvl[id] = l);
  };
  tasks.forEach((t) => visit(t.id, new Set()));
  const cols = [];
  tasks.forEach((t) => (cols[lvl[t.id]] = cols[lvl[t.id]] || []).push(t.id));
  const pos = {};
  cols.forEach((c) => c.forEach((id, i) => (pos[id] = i)));
  const bary = (id) => {
    const ds = (byId(id).depends_on || []).filter((x) => x in pos);
    return ds.length ? ds.reduce((a, x) => a + pos[x], 0) / ds.length : pos[id];
  };
  for (let pass = 0; pass < 4; pass++) {
    for (let c = 1; c < cols.length; c++) {
      const b = Object.fromEntries(cols[c].map((id) => [id, bary(id)]));
      cols[c].sort((x, y) => b[x] - b[y] || idx[x] - idx[y]);
      cols[c].forEach((id, i) => (pos[id] = i));
    }
  }
  const rows = Math.max(1, ...cols.map((c) => c.length)), xy = {};
  cols.forEach((c, ci) => c.forEach((id, i) => {
    const along = i + (rows - c.length) / 2;
    xy[id] = { x: PAD + ci * (NW + GLV), y: PAD + along * (NH + GIN) };
  }));
  const n = cols.length;
  return { xy, w: PAD * 2 + n * NW + (n - 1) * GLV, h: PAD * 2 + rows * NH + (rows - 1) * GIN };
}
function clip(s, n) { s = String(s || ""); return s.length > n ? s.slice(0, n - 1) + "…" : s; }
/** The task whose chain the graph traces: the one under the pointer, else the one selected. */
const traced = () => hover || (selected && byId(selected) ? selected : null);
function related(id) {

  const goDown = (x) => (byId(x)?.dependents || []).forEach((d) => { if (!down.has(d)) { down.add(d); goDown(d); } });
  goUp(id); goDown(id);

}
/** Time spent on a task: work (agent, checks, review, resolver) summed over its dispatches, the

function timeOf(t) {

    wall: tm.first && tm.done && tm.done >= tm.first ? tm.done - tm.first : null,

/** A ticking duration when a segment is open, else a fixed one; "" when nothing was spent. */
function timeSpan(t, tag = "span") {

  if (t.gate) return tt.gateWait !== null ? `waited ${dur(tt.gateWait)}` : "";

/** How much of ``el`` the open details panel covers on the right, in pixels (0 when closed). Its

function renderGraph(el) {

      <path class="box" d="M16,0 H${NW - 16} L${NW},${NH / 2} L${NW - 16},${NH} H16 L0,${NH / 2} Z"/>
      <text class="gl" x="${NW / 2}" y="13" text-anchor="middle">OWNER GATE${t.final ? " · FINAL" : ""}</text>
      <text class="id" x="22" y="29">${esc(clip(t.id, 18))}</text>

    </g>`;
  });
  setHTML(el, `<div class="graph-box" id="gbox"><svg class="graph ${rel ? "hl" : ""}" width="${Math.round(w * z)}" height="${Math.round(h * z)}" viewBox="0 0 ${w} ${h}">
    <defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--wait)"/></marker></defs>
    ${edges.join("")}${nodes.join("")}</svg>${cover ? `<span class="gpad" style="width:${cover}px"></span>` : ""}</div>
    <div class="small muted" style="margin-top:6px">Left to right in dependency order; times are work time (agent, checks, review, resolver). Hover a task to trace what it needs and what waits on it; click for details.${pan ? " Wheel to zoom, drag to move." : ""}</div>`);
}

      <div><button type="submit" class="active">Add</button></div>

  }).catch(() => { $("#cands").innerHTML = ""; });

/** Soft stop / Stop / Emergency stop / Schedule / Clear stops for one repository (id) or every one ("all"). */
const STOP_KINDS = ["soft", "hard", "emergency"];
const STOP_NAMES = { soft: "Soft stop", hard: "Stop", emergency: "Emergency stop" };
function stopButtons(id, on, suffix, any = STOP_KINDS.some((k) => on[k])) {
  const b = (kind, label, title) => `<button class="${kind} ${on[kind] ? "on" : ""}" data-stop="${kind}" data-stopid="${esc(id)}" ${on[kind] ? "disabled" : ""}
      title="${title}">${label}${suffix}</button>`;
  const at = schedOf(id);
  return b("soft", "Soft stop", "Create AGENT_SOFT_STOP: the agent at work finishes, then the loop stops and later resumes from there")
    + b("hard", "Stop", "Create AGENT_STOP: the task agent commits its work and writes a handoff note, then the loop stops")
    + b("emergency", "Emergency stop", "Create AGENT_EMERGENCY_STOP: every tool call is blocked at once (force kill)")
    + `<button class="sched ${at ? "on" + (at.kind === "emergency" ? " emergency-at" : "") : ""}" data-sched="${esc(id)}"
      title="${at ? "Scheduled: change or cancel it" : "Schedule a stop at a date and time"}">⏱ ${at ? `${STOP_NAMES[at.kind]} at ${whenText(at.at)}` : "Schedule…"}</button>`
    + `<button data-stop="clear" data-stopid="${esc(id)}" ${any ? "" : "disabled"}
      title="Remove AGENT_SOFT_STOP, AGENT_STOP and AGENT_EMERGENCY_STOP">Clear stops${suffix}</button>`;
}
/** The stop scheduled in a repository, or in every one when they all have the same ("all"). */
function schedOf(id) {
  if (id !== "all") return (active === id && data ? data.stop_at : (repos.find((r) => r.id === id) || {}).stop_at) || null;
  const s = repos.filter((r) => !r.missing).map((r) => r.stop_at || null);
  return s.length && s[0] && s.every((x) => x && x.kind === s[0].kind && x.at === s[0].at) ? s[0] : null;
}
/** A time to come, short: "18:30", "tomorrow 09:00", "Mon 3 Nov 18:30". */
function whenText(t) {
  const d = new Date(t * 1000), now = new Date(), tom = new Date(now);
  tom.setDate(now.getDate() + 1);
  const hm = d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
  if (d.toDateString() === now.toDateString()) return hm;
  if (d.toDateString() === tom.toDateString()) return "tomorrow " + hm;
  return d.toLocaleDateString([], { weekday: "short", day: "numeric", month: "short" }) + " " + hm;
}
/** Schedule, change or cancel a stop at a date and time: the server creates the stop file then. */
function openSchedule(id) {
  const r = repos.find((x) => x.id === id);
  const who = id === "all" ? "every watched repository" : r ? r.name : (data && data.project.name) || "this repository";
  const cur = schedOf(id), pad = (n) => String(n).padStart(2, "0");
  const local = (t) => { const d = new Date(t * 1000); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`; };
  const kind = cur ? cur.kind : "soft";
  const opt = (k, what) => `<label class="sopt"><input type="radio" name="skind" value="${k}" ${k === kind ? "checked" : ""}>
    <span><b>${STOP_NAMES[k]}</b><br><span class="small muted">${what}</span></span></label>`;
  const m = $("#modal");
  m.hidden = false;
  m.innerHTML = `<div class="inner confirm ${kind === "emergency" ? "emergency" : ""}" role="dialog" aria-modal="true" aria-label="Schedule a stop">
    <div class="mh"><b>Schedule a stop</b></div>
    <div class="cb">
      <div>At the time you give, this viewer creates the stop file in <b>${esc(who)}</b>. It must be running then; a stop missed while it was closed is created when it starts again.</div>
      <div class="sopts">${opt("soft", "The agent at work finishes, then the loop stops; it resumes from there.")}
        ${opt("hard", "The task agent commits its work in progress, writes a handoff note and ends.")}
        ${opt("emergency", "Every tool call is blocked at once: work in progress is lost.")}</div>
      <div class="swhen"><label>At <input type="datetime-local" id="schedat" value="${local(cur ? cur.at : Math.ceil(nowS() / 1800) * 1800 + 3600)}"></label>
        <button type="button" data-plus="30">+30 min</button><button type="button" data-plus="60">+1 h</button><button type="button" data-plus="120">+2 h</button><button type="button" data-plus="240">+4 h</button></div>
      <div class="err" id="scherr"></div>
    </div>
    <div class="cf">${cur ? `<button type="button" data-ans="cancel">Cancel the scheduled stop</button><span class="spacer"></span>` : ""}
      <button type="button" data-ans="no">Close</button><button type="button" class="go" data-ans="yes">${cur ? "Change" : "Schedule"}</button></div></div>`;
  const inner = m.querySelector(".inner");
  m.querySelectorAll('input[name="skind"]').forEach((x) => x.addEventListener("change", () => inner.classList.toggle("emergency", x.value === "emergency" && x.checked)));
  m.querySelectorAll("[data-plus]").forEach((b) => b.addEventListener("click", () => { $("#schedat").value = local(nowS() + 60 * parseInt(b.dataset.plus, 10)); }));
  m.querySelectorAll("[data-ans]").forEach((btn) => btn.addEventListener("click", async (ev) => {
    ev.stopPropagation();
    const ans = btn.dataset.ans;
    if (ans === "no") { m.hidden = true; return; }
    let body = { id, kind: null };
    if (ans === "yes") {
      const at = new Date($("#schedat").value).getTime() / 1000;
      if (!at || at <= nowS()) { $("#scherr").textContent = "Give a time in the future."; return; }
      body = { id, kind: m.querySelector('input[name="skind"]:checked').value, at };
    }
    const res = await postJSON("/api/stop/schedule", body);
    if (!res.ok) { $("#scherr").textContent = res.body.error || "Not done: server error."; return; }
    m.hidden = true;
    ovEtag = null; etag = null;
    pollNow();
  }));
  $("#schedat").focus();
}
/** The confirmation of a stop in the modal: resolves true on the confirm button only. */
function confirmStop(what, who) {
  const emergency = what === "emergency";
  const body = emergency
    ? `<div class="warn">This is a force kill. Work in progress is lost.</div>
       <div>AGENT_EMERGENCY_STOP is created in <b>${esc(who)}</b>. From the next tool call, every call of every session there is blocked, yours included:</div>
       <ul><li>the agent at work stops mid-step: nothing is committed, no handoff note is written;</li>
       <li>its uncommitted changes stay in the working tree as they are, possibly half-written;</li>
       <li>the loop resumes only after you delete the file and check the repository.</li></ul>
       <div>Use it when something is doing damage. To stop quickly without losing work, use <b>Stop</b>.</div>`
    : `<div>AGENT_STOP is created in <b>${esc(who)}</b>. The loop does not wait for the task to finish:</div>
       <ul><li>at its next tool call the task agent is told to commit its work in progress, write a handoff note (done, to do) and end; every other call is refused;</li>
       <li>a reviewer, resolver or challenger ends without writing and is spawned again on restart;</li>
       <li>the paused task is not counted as an attempt; the next dispatch starts from its commits and its note.</li></ul>
       <div>The agent's context is lost. To let it finish, use <b>Soft stop</b>.</div>`;
  const m = $("#modal");
  m.hidden = false;
  m.innerHTML = `<div class="inner confirm ${emergency ? "emergency" : ""}" role="alertdialog" aria-modal="true">
    <div class="mh"><b>${emergency ? "⚠ Emergency stop" : "Stop the loop"}</b></div>
    <div class="cb">${body}</div>
    <div class="cf"><button type="button" data-ans="no">Cancel</button>
      <button type="button" class="go" data-ans="yes">${emergency ? "Force kill now" : "Stop with handoff"}</button></div></div>`;
  return new Promise((resolve) => {
    m.querySelectorAll("[data-ans]").forEach((btn) => btn.addEventListener("click", (ev) => {
      ev.stopPropagation();
      m.hidden = true;
      resolve(btn.dataset.ans === "yes");
    }));
    m.querySelector('[data-ans="no"]').focus();
  });
}
async function setStop(id, what) {
  const r = repos.find((x) => x.id === id), who = id === "all" ? "every watched repository" : (r ? r.name : "this repository");
  if (what === "hard" || what === "emergency") {
    if (!(await confirmStop(what, who))) return;
  } else {
    const ask = id === "all" ? { soft: `Create AGENT_SOFT_STOP in ${who}? The loop stops when the agent at work ends.`,
      clear: `Remove the stop files from ${who}?` }[what] : null;
    if (ask && !confirm(ask)) return;
  }
  const res = await postJSON("/api/stop", { id, kind: what === "clear" ? null : what });
  if (!res.ok) alert("Not done: " + ((res.body.failed || []).join("\n") || res.body.error || "server error"));
  ovEtag = null; etag = null;
  pollNow();
}
async function addRepo(path) {
  const err = $("#adderr");
  if (err) err.textContent = "";
  const res = await postJSON("/api/repos/add", { path });
  if (!res.ok) { if (err) err.textContent = res.body.error || "Not added."; return; }
  $("#modal").hidden = true;
  ovEtag = null;
  await pollNow();
  switchTo(res.body.id);
}
async function removeRepo(id) {
  const r = repos.find((x) => x.id === id);
  if (!confirm(`Stop watching ${r ? r.name : "this repository"}? Nothing in the repository changes.`)) return;
  await postJSON("/api/repos/remove", { id });
  if (active === id) switchTo("overview");

  pollNow();
}
function tick() {
  document.querySelectorAll("[data-since]").forEach((e) => (e.textContent = dur(nowS() - parseFloat(e.dataset.since) + (parseFloat(e.dataset.base) || 0))));
  document.querySelectorAll("[data-ago]").forEach((e) => { const v = parseFloat(e.dataset.ago); if (v) e.textContent = ago(v); });
  const live = $("#live");
  if (SNAP) { live.className = "live"; $("#fresh").textContent = "snapshot"; return; }

  $("#fresh").textContent = lastOk ? (failing ? "disconnected" : "live") : "connecting…";
}

  const el = ev.target.closest("[data-stop],[data-sched],[data-rclose],[data-rtab],[data-add],[data-addpath],[data-copy],[data-task],[data-file],[data-tab],[data-tfilter],[data-zoom],[data-full],[data-close],[data-pview],[data-discuss],[data-question],[data-apply],[data-conv],[data-cdisc],[data-startloop],[data-review]");

  if (ds.sched !== undefined) { openSchedule(ds.sched); return; }

  if (ds.discuss) { openDiscuss(ds.discuss, ds.did); return; }

  if (ds.copy !== undefined) {
    const done = () => { el.textContent = "Copied"; setTimeout(() => (el.textContent = "Copy"), 1200); };
    if (navigator.clipboard) navigator.clipboard.writeText(ds.copy).then(done, () => prompt("Copy:", ds.copy));
    else prompt("Copy:", ds.copy);
  } else if (ds.file) openFile(ds.file);
  else if (ds.task) { selected = ds.task; renderDrawer(); if (tab === "graph") { renderView(); revealSelected(); } }
  else if (ds.tab) { tab = logTab = ds.tab; store("tab", tab); renderView(); }
  else if (ds.tfilter) { tfilter = ds.tfilter; renderView(); }
  else if (ds.close === "drawer") { selected = null; renderDrawer(); if (tab === "graph") renderView(); }

  else if (ds.zoom) {

document.addEventListener("mouseover", (ev) => {

/** Hover tracing toggles classes in place instead of re-rendering the graph: a re-render would
 *  restart the glow of the running task and gates and skip the fade. */
function traceHover() {
  const svg = $("svg.graph");
  if (!svg) return;
  const rel = traced() ? related(traced()) : null;
  svg.classList.toggle("hl", !!rel);
  svg.querySelectorAll(".node").forEach((n) => n.classList.toggle("on", !!rel && rel.has(n.dataset.task)));
  svg.querySelectorAll(".edge").forEach((e) => e.classList.toggle("on", !!rel && rel.has(e.dataset.from) && rel.has(e.dataset.to)));
}
let resizeTimer = null;

/* the handle above the message box: dragging it up makes the box taller, the discussion shorter */
function setChatHeight(h) {

{
  const split = $("#chatsplit"), box = $("#chatin");

/* the width of the discussion in the Questions view: drag the line at its left */
(function discussSplit() {
  const split = $("#dsplit"), grid = $("#pv-discuss"), chatBox = () => grid.querySelector(".chat");
  const setWidth = (w) => {
    w = Math.max(320, Math.round(w));

/* graph: a drag moves it, the wheel zooms around the pointer (app layout and full screen only) */
